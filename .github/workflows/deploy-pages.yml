name: Deploy to GitHub Pages

# The site is plain static HTML/CSS/JS with no build step, so this uploads the
# repository as-is. Release data and plugin manifests are fetched in the
# visitor's browser, which keeps the deployed pages current without rebuilds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `enablement` provisions the Pages site (build type: GitHub Actions) on the
      # first run, so the workflow does not fail before Pages is turned on in the
      # repository settings. It is a no-op once Pages is already configured.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
